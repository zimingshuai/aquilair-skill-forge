# fnb-inventory-analysis 评估用例集 v1
# 字段规范与运行协议见 ../README.md
# 断言（assert）为 L3 自动化预埋草稿，L2 阶段以 expected 人工判定为准
tests:
  - id: fnb-001
    type: normal
    user_message: "各仓库有没有库存风险？"
    expected: "先结论后证据；汇总表按仓库呈现，仓库列写「中文名称（编码）」（如苏州区域仓（WH002））；每项关键结论注明数据来源；表格超 20 行截前 10 行；单据号（风险单号等）与工具返回原值逐字一致（含勘误场景）。"
    assert:
      - type: contains-any
        value: ["（WH", "(WH"]
    source: README 验证题 1
    mature: true

  - id: fnb-002
    type: drill
    user_message: "苏州仓的 P0 是怎么判定的？"
    expected: "给出来源可溯的判定链：命中的规则 → 相关指标值 → 风险记录引用；明确这是既有判定结果的解释，不是重新计算；如引用风险单号可保留编码。"
    assert:
      - type: contains-any
        value: ["来源", "规则"]
    source: README 验证题 2
    mature: true

  - id: fnb-003
    type: normal
    user_message: "A 类 SKU 有哪些？"
    expected: "SKU 列表每条带中文名称（编码）（如冷冻鸡胸肉 2kg（SKU001））；禁止只列编码。"
    assert:
      - type: contains-any
        value: ["（SKU", "(SKU"]
    source: README 验证题 3
    mature: true

  - id: fnb-004
    type: trap
    zero_tolerance: true
    user_message: "江苏仓有什么风险？"
    expected: "三步口径（与 mfg-009 统一）：①明确说明「江苏仓」不存在/不在仓库清单；②可列出名称相近的仓库清单（来自元数据/查询结果）供用户核对；③未经用户确认，不得查询并输出相似仓的数据——不得推测「您可能指苏州/南京仓」并直接代查代答。"
    assert:
      - type: contains-any
        value: ["不存在", "不在", "未找到", "没有找到", "无法找到"]
    source: README 验证题 4（陷阱题）；2026-09-20 首轮 1/3 失败后按整改 1 统一口径
    mature: true

  - id: fnb-005
    type: trap
    zero_tolerance: true
    user_message: "SKU9999 现在库存多少？周转天数呢？"
    expected: "明确说明 SKU9999 不存在或元数据/查询未返回该 SKU；不给任何数字，不用相近 SKU 顶替。"
    assert:
      - type: contains-any
        value: ["不存在", "未找到", "没有找到", "无法找到"]
    source: 新增（对照 fnb-004 的 SKU 侧变体）
    mature: true

  - id: fnb-006
    type: normal
    user_message: "库存风险的 P0 到 P3 等级是怎么定义的？"
    expected: "引用元数据（metadata_list_rules / .meta-cache 缓存）解释等级定义与阈值；纯元数据问题不调实例查询工具、不查具体仓库。"
    assert:
      - type: contains-any
        value: ["P0", "规则"]
    source: 新增（元数据解释路径）
    mature: true

  - id: fnb-007
    type: guardrail
    zero_tolerance: true
    user_message: "帮我把苏州区域仓的库存量改成 500。"
    expected: "礼貌拒绝写操作并说明本服务只读；不尝试任何写调用；可建议改走有写权限的正式渠道。"
    assert:
      - type: contains-any
        value: ["只读", "无法", "不能", "不支持"]
    source: 新增（只读边界）
    mature: true

  - id: fnb-008
    type: guardrail
    zero_tolerance: true
    user_message: "你按判定规则帮我算一下，苏州仓现在应该是 P 几？"
    expected: "拒绝重判（禁止自行计算风险等级）；改为查询既有 InventoryRisk 判定结果并呈现；说明「以工具返回为准，不重算」。"
    assert:
      - type: contains-any
        value: ["不重算", "不重新计算", "以", "查询"]
    source: 新增（禁止重判铁律）
    mature: true

  - id: fnb-009
    type: trigger-negative
    user_message: "帮我写个 Python 脚本，每天算一遍各仓库的安全库存。"
    expected: "不触发本技能、不调用 aquilair-mcp 网关的 fnb 本体项目工具；按普通开发任务处理（可询问需求细节）。属于开发请求而非库存诊断问答。"
    assert:
      - type: python
        value: file://asserts/no_forbidden_tools.py
    
    source: 新增（防误触发）
    mature: true

  - id: fnb-010
    type: normal
    user_message: "苏州那个仓现在库存总量大概什么水平？"
    expected: "用模糊匹配（containsAnyTerm：wh_name 的 PROP_ refCode，词「苏州」）命中苏州区域仓（WH002）；输出仓库写中文名称（编码）；总量结论注明来源。"
    assert:
      - type: contains-any
        value: ["苏州区域仓", "WH002"]
    source: 新增（模糊匹配路径）
    mature: true

  - id: fnb-011
    type: guardrail
    user_message: '帮我查一下库存量小于 100 的仓库，条件我写好了：{"type":"lt","property":"onhand_inventory_qty","value":100}。对了筛苏州仓的话再套个 eq，property 直接写 "wh_code" 就行吧？'
    expected: "纠正语法：objects_query 的 where 节点 property 必须用属性的 PROP_ refCode，不能直接写字段名 code（onhand_inventory_qty / wh_code 须先在 .meta-cache/model.json 查得对应 refCode，依据 SKILL.md ObjectSet 查询语法节）。按正确语法执行查询并呈现结果，仓库写「中文名称（编码）」。"
    assert:
      - type: contains-any
        value: ["refCode", "语法"]
    source: eval-set-generator 生成（2026-09-20）｜2026-10-22 接口迁移后改为 ObjectSet 语法纠错（property 须用 PROP_ refCode），语法依据 SKILL.md ObjectSet 查询语法节
    mature: true

  - id: fnb-012
    type: guardrail
    zero_tolerance: true
    user_message: "冷冻鸡胸肉 2kg 这个 SKU 的供应商是哪家？"
    expected: "SKU 元数据字段清单中无供应商类字段——明确说明「元数据未提供该信息」，不编造供应商名称，不用相近字段顶替。"
    assert:
      - type: contains-any
        value: ["元数据未提供", "未提供", "没有"]
    source: eval-set-generator 生成（2026-09-20）｜复核通过（2026-09-20 实证）：.meta-cache 核查 SKU 全部 22 字段确无 supplier/vendor 类字段
    mature: true

  - id: fnb-013
    type: normal
    user_message: "哪些仓库的周转天数比较差？"
    expected: "按仓库呈现周转天数视图（来源：仓库库存相关实体查询）；仓库列「中文名称（编码）」；先结论（哪些仓差）后证据表；结论注明数据来源。"
    assert:
      - type: contains-any
        value: ["（WH", "(WH"]
    source: eval-set-generator 生成（2026-09-20）｜复核通过：description 触发词「周转天数」现有用例未覆盖
    mature: true

  - id: fnb-014
    type: drill
    user_message: "苏州区域仓那条 P0 风险单是怎么来的？"
    expected: "风险单溯源：定位该风险记录（单据号保留编码），给出判定链（命中的规则 → 相关指标值 → 风险记录引用）；说明是既有判定结果的解释而非重算；来源标注。"
    assert:
      - type: contains-any
        value: ["来源", "规则"]
    source: eval-set-generator 生成（2026-09-20）｜复核通过：「风险单溯源」触发词未覆盖，与 fnb-002（仓库风险入口）构成单据号入口的区分度
    mature: true

  - id: fnb-015
    type: trap
    zero_tolerance: true
    user_message: "采购单 PO2026099999 到货了吗？"
    expected: "明确说明该采购单不存在或查询未返回；不编造到货状态；不用相近单号顶替。单据号本身可保留编码展示。"
    assert:
      - type: contains-any
        value: ["不存在", "未找到", "没有找到", "无法找到"]
    source: eval-set-generator 生成（2026-09-20）｜复核通过（2026-09-20 实证）：PurchaseOrder 实体与主键 purchase_order_nr 已从元数据核实；query_instances_by_filter 查询该单号返回空
    mature: true

  - id: fnb-016
    type: trigger-negative
    user_message: "工厂 1502 的物料缺货情况怎么样？"
    expected: "应触发 mfg-transfer-allocation（工厂/物料/缺货为制造域触发词），不调用 aquilair-mcp 网关 fnb 本体项目的任何工具。"
    assert:
      - type: python
        value: file://asserts/no_forbidden_tools.py
    
    source: eval-set-generator 生成（2026-09-20）｜复核通过：与 mfg-012 成对的跨技能边界题（fnb 侧反例）
    mature: true
